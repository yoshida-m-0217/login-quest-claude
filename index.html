<script>
// 少し前まで ある日のクエストを進めていたなら、選ぶ画面を飛ばしてその続きへ
// （iPad は別のアプリから戻ると最初の画面から開き直すことがあるため。「日をえらぶ」から来たときは飛ばさない）
(function () {
  if (location.search.indexOf('pick') >= 0) return;
  try {
    var p = JSON.parse(localStorage.getItem('lq-claude-pick') || 'null');
    if (p && !p.done && (p.day === 'day1' || p.day === 'day2') && Date.now() - p.at < 3 * 3600 * 1000) location.replace(p.day + '/');
  } catch (e) { /* 使えなくてもよい */ }
})();
</script>

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0c0b2c; color: #f7f7f2; }
body {
  font-family: 'LoginQuestDot', 'Hiragino Kaku Gothic ProN', sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2vh;
  background-image: repeating-conic-gradient(#13123d 0 25%, #0c0b2c 0 50%);
  background-size: 64px 64px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  text-shadow: 3px 3px 0 #0a0c24;
}
.sub { font-size: clamp(16px, 2.2vw, 26px); color: #ffd84a; letter-spacing: .12em; }
h1 { margin: 0 0 1vh; font-weight: normal; font-size: clamp(36px, 6vw, 76px); letter-spacing: .08em; }
/* RPG のメニュー窓 */
.win {
  width: min(620px, 88vw);
  padding: 22px 26px 18px;
  background: linear-gradient(180deg, #24309a 0%, #18206e 55%, #10164c 100%);
  border: 5px solid #f4f4f4; border-radius: 10px;
  box-shadow: 0 0 0 4px #0a0c24, 8px 9px 0 4px rgba(0, 0, 0, .45);
}
.ask { font-size: clamp(18px, 2.4vw, 28px); color: #c8ccf0; margin: 0 0 12px 6px; }
.day {
  display: flex; align-items: center; gap: 18px;
  padding: 14px 12px; margin: 4px 0;
  color: #f7f7f2; text-decoration: none; border-radius: 6px;
}
.day .cur { width: 1.1em; color: #ffd84a; opacity: .35; font-size: clamp(26px, 3.4vw, 40px); }
.day b { font-weight: normal; font-size: clamp(34px, 4.6vw, 54px); color: #ffe066; text-shadow: 3px 3px 0 #a8801a; min-width: 3.4em; }
.day span { font-size: clamp(20px, 2.6vw, 30px); }
.day:hover .cur, .day:active .cur, .day:focus .cur { opacity: 1; }
.day:active { background: rgba(255, 255, 255, .12); }
.hint { font-size: clamp(14px, 1.8vw, 20px); color: #9aa0c8; }
#rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0c0b2c; font-size: 36px; line-height: 1.6; text-align: center; align-items: center; justify-content: center; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
